name: Shiksha Exam Calendar — Scrape & Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      delete_removed:
        description: "Delete Calendar events no longer present in the Sheet"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 3 * * *"     # 03:00 UTC = 08:30 AM IST — scrape + sync run back-to-back daily

jobs:
  scrape:
    name: Run scraper
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ET
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser + OS dependencies
        working-directory: ET
        run: playwright install --with-deps chromium

      - name: Run scraper
        working-directory: ET
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scraper.py

  sync-calendar:
    name: Sync to Google Calendar
    needs: scrape          # only runs if the scrape job succeeded
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ET
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Calendar sync
        working-directory: ET
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          SYNC_TIMEZONE: Asia/Kolkata
          DELETE_REMOVED_EVENTS: ${{ github.event.inputs.delete_removed || 'false' }}
        run: python calendar_sync.py
