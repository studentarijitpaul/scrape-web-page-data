name: Shiksha Exam Calendar — Scrape & Sync

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      delete_removed:
        description: "Delete Calendar events no longer present in the Sheet"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 08:30 AM IST


jobs:

  scrape:
    name: Run scraper
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ET
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser + OS dependencies
        working-directory: ET
        run: |
          playwright install --with-deps chromium

      - name: Run scraper
        working-directory: ET
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scraper.py


  sync-calendar:
    name: Sync to Google Calendar
    needs: scrape
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Kolkata

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ET
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Calendar ID
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          CALENDAR_ID="$(printf '%s' "$GOOGLE_CALENDAR_ID" | tr -d '\r\n')"

          echo "Calendar ID present: $([ -n "$CALENDAR_ID" ] && echo true || echo false)"
          echo "Calendar ID length: ${#CALENDAR_ID}"

          case "$CALENDAR_ID" in
            *@group.calendar.google.com)
              echo "Calendar ID format: OK"
              ;;
            *)
              echo "ERROR: Calendar ID does not end with @group.calendar.google.com"
              exit 1
              ;;
          esac

      - name: Test Google Calendar access
        working-directory: ET
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          python - <<'PY'
          import os
          import json

          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          calendar_id = os.environ["GOOGLE_CALENDAR_ID"].strip()

          credentials_info = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials = Credentials.from_service_account_info(
              credentials_info,
              scopes=[
                  "https://www.googleapis.com/auth/calendar"
              ]
          )

          service = build(
              "calendar",
              "v3",
              credentials=credentials
          )

          calendar = service.calendars().get(
              calendarId=calendar_id
          ).execute()

          print("Google Calendar connection successful!")
          print("Calendar name:", calendar.get("summary"))
          print("Calendar timezone:", calendar.get("timeZone"))
          PY

      - name: Run Calendar sync
        working-directory: ET
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          SYNC_TIMEZONE: Asia/Kolkata
          DELETE_REMOVED_EVENTS: ${{ github.event.inputs.delete_removed || 'false' }}
        run: |
          python calendar_sync.py
